name: Release macOS
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2
      - run: rustup default 1.98.1
      - run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: php bin/phpunit
      - run: php bin/console lint:container
      - run: npm run runtime:download
      - name: Import Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?Missing Developer ID Application identity}"
          : "${APPLE_CERTIFICATE:?Missing certificate}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY:?Missing API key ID}"
          : "${APPLE_API_ISSUER:?Missing API issuer}"
          : "${APPLE_API_PRIVATE_KEY:?Missing API private key}"
          [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application:"* ]]
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize app with Tauri
        run: npx tauri build --bundles app,dmg
      - name: Verify app and notarize DMG
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/Air Quality.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          dmg="${dmg_files[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"] == "Accepted", r' "$RUNNER_TEMP/notarization.json"
          xcrun stapler staple "$dmg"
          bash scripts/verify-dmg.sh "$dmg"
          mkdir -p release
          cp "$dmg" "release/Air-Quality-${GITHUB_REF_NAME#v}-${{ matrix.arch }}.dmg"
          (cd release && shasum -a 256 *.dmg > "SHA256-${{ matrix.arch }}.txt")
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Air Quality ${GITHUB_REF_NAME#v}" --generate-notes "${args[@]}"
